{% extends "admin/base_admin.html" %}

{% block admin_content %}
<div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold text-primary">Yeni Ürün Ekle</h1>
    <a href="{{ url_for('admin_products') }}" class="text-sm text-textMuted hover:text-primary transition-colors">
        <i class="fa-solid fa-arrow-left mr-1"></i> Geri Dön
    </a>
</div>

<div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 md:p-8">
    <form action="{{ url_for('admin_add_product') }}" method="POST" class="space-y-6">
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="md:col-span-2">
                <label class="block text-sm font-medium text-textMain mb-2">Ürün Adı</label>
                <input type="text" name="name" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
            </div>
            
            <div class="md:col-span-2">
                <label class="block text-sm font-medium text-textMain mb-2">Ürün Açıklaması</label>
                <textarea name="description" rows="4" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"></textarea>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-textMain mb-2">Fiyat (₺)</label>
                <input type="number" step="0.01" name="price" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-textMain mb-2">İndirimli Fiyat (₺) - Opsiyonel</label>
                <input type="number" step="0.01" name="discount_price" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-textMain mb-2">Kategori</label>
                <select name="category_id" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent bg-white">
                    {% for category in categories %}
                    <option value="{{ category.id }}">{{ category.name }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-textMain mb-2">Stok Miktarı</label>
                <input type="number" name="stock" value="0" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-textMain mb-2">Bedenler (Virgülle ayırın, Örn: S,M,L,XL)</label>
                <input type="text" name="sizes" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-textMain mb-2">Renk</label>
                <input type="text" name="color" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
            </div>
            
            <div class="md:col-span-2">
                <label class="block text-sm font-medium text-textMain mb-2">Görsel URL</label>
                <input type="url" name="image" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
                <p class="text-xs text-textMuted mt-2">Demo için Unsplash vb. görsel URL'si kullanabilirsiniz.</p>
            </div>
        </div>
        
        <div class="flex justify-end pt-4 border-t border-gray-100">
            <button type="submit" class="bg-primary text-white px-8 py-3 rounded-lg font-medium hover:bg-gray-800 transition-colors shadow-lg">
                Ürünü Ekle
            </button>
        </div>
    </form>
</div>
{% endblock %}
