{% extends "base.html" %}

{% block title %}Kayıt Ol - LUNERA{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-16 flex justify-center items-center min-h-[70vh]">
    <div class="w-full max-w-lg bg-white rounded-xl shadow-lg border border-gray-100 p-8">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-primary mb-2">Aramıza Katılın</h1>
            <p class="text-textMuted text-sm">LUNERA ayrıcalıklarından yararlanmak için hesap oluşturun.</p>
        </div>

        <form action="{{ url_for('register') }}" method="POST" class="space-y-6">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label for="first_name" class="block text-sm font-medium text-textMain mb-2">Ad</label>
                    <input type="text" id="first_name" name="first_name" required 
                           class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all"
                           placeholder="Adınız">
                </div>
                <div>
                    <label for="last_name" class="block text-sm font-medium text-textMain mb-2">Soyad</label>
                    <input type="text" id="last_name" name="last_name" required 
                           class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all"
                           placeholder="Soyadınız">
                </div>
            </div>

            <div>
                <label for="email" class="block text-sm font-medium text-textMain mb-2">E-posta Adresi</label>
                <input type="email" id="email" name="email" required 
                       class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all"
                       placeholder="ornek@email.com">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-textMain mb-2">Şifre</label>
                <input type="password" id="password" name="password" required 
                       class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all"
                       placeholder="En az 6 karakter">
            </div>

            <div>
                <label for="password_confirm" class="block text-sm font-medium text-textMain mb-2">Şifre (Tekrar)</label>
                <input type="password" id="password_confirm" name="password_confirm" required 
                       class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all"
                       placeholder="Şifrenizi doğrulayın">
            </div>

            <button type="submit" class="w-full bg-primary text-white rounded-lg px-4 py-3 font-medium hover:bg-gray-800 transition-colors">
                Kayıt Ol
            </button>
        </form>

        <div class="mt-8 text-center text-sm text-textMuted border-t border-gray-100 pt-6">
            Zaten bir hesabınız var mı? 
            <a href="{{ url_for('login') }}" class="text-primary font-bold hover:underline ml-1">Giriş Yapın</a>
        </div>
    </div>
</div>
{% endblock %}
